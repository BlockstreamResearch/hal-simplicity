on:   # yamllint disable-line rule:truthy
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

name: Release

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build hal-simplicity
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} --bin hal-simplicity

      - name: Build hal-simplicity (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --bin hal-simplicity

      - name: Build hal-simplicity-daemon
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} --bin hal-simplicity-daemon --features daemon

      - name: Build hal-simplicity-daemon (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --bin hal-simplicity-daemon --features daemon

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          TAG=${GITHUB_REF_NAME}
          STAGING="hal-simplicity-${TAG}-${{ matrix.target }}"
          mkdir "$STAGING"
          cp target/${{ matrix.target }}/release/hal-simplicity "$STAGING/"
          cp target/${{ matrix.target }}/release/hal-simplicity-daemon "$STAGING/"
          cp README.md LICENSE "$STAGING/" 2>/dev/null || true
          tar czf "${STAGING}.tar.gz" "$STAGING"
          echo "ASSET=${STAGING}.tar.gz" >> $GITHUB_ENV

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $staging = "hal-simplicity-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory $staging
          Copy-Item "target\${{ matrix.target }}\release\hal-simplicity.exe" "$staging\"
          Copy-Item "target\${{ matrix.target }}\release\hal-simplicity-daemon.exe" "$staging\"
          if (Test-Path README.md) { Copy-Item README.md "$staging\" }
          if (Test-Path LICENSE) { Copy-Item LICENSE "$staging\" }
          Compress-Archive -Path "$staging\*" -DestinationPath "$staging.zip"
          echo "ASSET=$staging.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
